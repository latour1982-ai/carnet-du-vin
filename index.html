<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D0C0B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet-du-Vin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Carnet-du-Vin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F3F3EF;--surface:#FFFFFF;--ink:#241E21;--muted:#6B6367;--line:#D9D4CF;
  --claret:#7C2035;--straw:#7A6512;--on-acc:#FFFFFF;--hit:#2C6A47;--extra:#A4452A;--near:#8A6410;
  --tint:rgba(36,30,33,.045);
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#17151A;--surface:#211E24;--ink:#ECE7E4;--muted:#A49DA1;--line:#3A3540;
    --claret:#DA7A8F;--straw:#D3BD5B;--on-acc:#17151A;--hit:#6FC497;--extra:#E78C6B;--near:#E2B95A;
    --tint:rgba(236,231,228,.06);
  }
}
:root[data-theme="dark"]{
  --paper:#17151A;--surface:#211E24;--ink:#ECE7E4;--muted:#A49DA1;--line:#3A3540;
  --claret:#DA7A8F;--straw:#D3BD5B;--on-acc:#17151A;--hit:#6FC497;--extra:#E78C6B;--near:#E2B95A;
  --tint:rgba(236,231,228,.06);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-top:26px}
h1{font-family:var(--f-head);font-weight:700;font-size:30px;letter-spacing:.05em;margin:0;line-height:1.3}
.sub{margin:2px 0 14px;color:var(--muted);font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{appearance:none;border:0;background:none;font:inherit;font-weight:500;color:var(--muted);padding:10px 14px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-top:28px;padding-bottom:72px}
h2{font-family:var(--f-head);font-weight:700;font-size:23px;margin:0 0 4px;letter-spacing:.03em}
h3{font-family:var(--f-head);font-weight:600;font-size:18px;margin:0 0 6px;letter-spacing:.04em}
p{margin:0 0 12px}
.hint{color:var(--muted);font-size:13px}
.loading{color:var(--muted)}
.notice{background:var(--tint);border-left:3px solid var(--muted);padding:10px 14px;margin:0 0 20px;font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:4px;cursor:pointer;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{background:transparent;color:var(--extra);border-color:var(--extra)}
.link{appearance:none;border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.backbar{margin:-8px 0 18px}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.headrow .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:5px}
.sheet-w{--acc:var(--straw)}
.sheet-r{--acc:var(--claret)}
.cbadge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:3px;background:var(--acc);color:var(--on-acc);font-weight:500;vertical-align:middle}
.code{font-family:var(--f-head);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}

/* practice */
.opencode{display:flex;gap:8px;margin:16px 0 22px;max-width:420px}
.opencode input{flex:1}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.codecard{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--acc);padding:12px 14px;border-radius:4px;cursor:pointer}
.codecard:hover{border-color:var(--acc)}
.codecard .code{font-size:24px;display:block;line-height:1.3}
.codecard small{display:block;color:var(--muted);font-size:12px;line-height:1.6}
.codecard.empty{opacity:.55}
.codecard .wnm{color:var(--ink);font-size:12px;line-height:1.5;margin:2px 0}
.empty-state{background:var(--surface);border:1px dashed var(--line);padding:28px;text-align:center;border-radius:4px}

/* forms */
input[type=text],input[type=number],input[type=date],input:not([type]),textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.fields .full{grid-column:1/-1}
.fields label>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.fields label>span b{color:var(--extra);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:7px 18px;cursor:pointer;font-size:14px}
.seg input:checked+label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible+label{outline:2px solid var(--ink);outline-offset:-2px}
.formhead{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.formhead .code{font-size:34px;color:var(--acc)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 20px 8px;margin:0 0 16px}
.sec>h3{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.item{display:grid;grid-template-columns:9.5em 1fr;gap:6px 16px;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item-h{display:flex;flex-direction:column;gap:1px}
.item-l{font-weight:700;font-size:14px;line-height:1.5}
.item-p,.item-n{font-size:12px;color:var(--muted);line-height:1.5}
.item-p .cnt{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.grp{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.grp:last-child{margin-bottom:0}
.grp-n{flex:0 0 auto;font-size:11px;color:var(--muted);width:4.6em;padding-top:6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;line-height:1.5;user-select:none;background:var(--surface)}
.chips label:hover{border-color:var(--acc)}
.chips input:checked+label{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.chips input:focus-visible+label{outline:2px solid var(--ink);outline-offset:2px}
.sw{width:14px;height:14px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.submitbar{display:flex;flex-direction:column;gap:14px;align-items:flex-start;margin-top:6px}

/* result */
.scorehead{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:6px 0 20px}
.bigscore{font-family:var(--f-head);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:20px;color:var(--muted);margin-left:6px}
.scoremeta{font-size:13px;color:var(--muted);padding-bottom:6px}
.winecard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:4px;padding:16px 20px;margin-bottom:18px}
.winecard .wname{font-family:var(--f-head);font-size:20px;font-weight:700;line-height:1.4}
.winecard dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:10px 0 0;font-size:14px}
.winecard dt{color:var(--muted)}
.winecard dd{margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.t{display:inline-block;font-size:13px;padding:1px 9px;border-radius:999px;margin:2px 4px 2px 0;line-height:1.6;border:1px solid transparent}
.t-hit{background:var(--hit);color:var(--on-acc)}
.t-extra{color:var(--extra);border-color:var(--extra)}
.t-miss{color:var(--muted);border:1px dashed var(--muted)}
.t-none{color:var(--muted);font-size:13px}
.t small{font-size:10px;margin-left:4px;opacity:.85}
.t-alt{color:var(--hit);border-color:var(--hit);background:transparent}
.t-near{color:var(--near);border:1px solid var(--near)}
.t-cov{color:var(--hit);border:1px dashed var(--hit)}
.t-altlist{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.secpt{float:right;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.need{color:var(--acc);font-weight:700}
.mchip{appearance:none;font:inherit;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;line-height:1.5;background:var(--surface);color:var(--ink)}
.mchip[data-st="1"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.mchip[data-st="2"]{border:1px dashed var(--acc);color:var(--acc)}
.mchip[data-st="2"]::after{content:"別解";font-size:10px}
.hint .mchip{padding:0 8px;font-size:12px;vertical-align:middle}
.hint .mchip::after{content:none}
.rrow{display:grid;grid-template-columns:8.5em 1fr 1fr 3.6em;gap:4px 14px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start}
.rrow:last-child{border-bottom:0}
.rrow.head{font-size:12px;color:var(--muted);padding-top:2px}
.rl{font-weight:700;font-size:14px}
.rs{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}
.rs.na{color:var(--muted);font-weight:400}
.cap{display:none;font-size:11px;color:var(--muted);margin-right:6px}
.prose{white-space:pre-wrap;font-size:14px}
.others{list-style:none;margin:0;padding:0}
.others li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.others li:last-child{border-bottom:0}

/* list */
.wlist{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.wrow{display:grid;grid-template-columns:5.5em 1fr auto auto;gap:6px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--acc)}
.wrow:last-child{border-bottom:0}
.wrow .code{font-size:18px}
.wrow .wn{font-size:14px;line-height:1.5}
.wrow .wn small{display:block;color:var(--muted);font-size:12px}
.hidden-name{color:var(--muted);letter-spacing:.2em}
.vialtog{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted)}
.vialtog.on{color:var(--ink);border-color:var(--acc)}
.vialtog input{margin:0;accent-color:var(--acc)}
.wrow.novial{opacity:.6}
.vial{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.vial .n{font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center}
.vial button{width:26px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;line-height:1}
.wacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mstat{font-size:12px;color:var(--muted)}
.mstat.ok{color:var(--hit)}
.aistatus{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.5em}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 16px}
.stat b{font-family:var(--f-head);font-size:30px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:6px;margin:8px 0 4px}
.bar{display:grid;grid-template-columns:10em 1fr 3em;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--tint);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--acc)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
details{margin-bottom:16px}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:4px 0}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.hrow{display:grid;grid-template-columns:6.5em 5em 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left;background:none;border-left:4px solid var(--acc);border-top:0;border-right:0}
.hrow:last-child{border-bottom:0}
button.hrow{cursor:pointer}
button.hrow:hover{background:var(--tint)}
.hrow .who{font-size:12px;color:var(--muted)}
.hrow .sc{font-variant-numeric:tabular-nums;font-weight:700}
.scope{margin-bottom:18px}
.sessbox{border-left:4px solid var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin:0 0 12px}
.filters label>span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.filters select,.filters input{width:auto;min-width:8em;padding:6px 8px}
.filters .wide input{min-width:14em}
.filters .favchk{align-self:center}
.star{appearance:none;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 6px 0 0;cursor:pointer;vertical-align:-2px}
.star.on{color:#D9A400}
.pfil{display:flex;gap:16px;flex-wrap:wrap;margin:-4px 0 14px}
.item.missing{box-shadow:inset 3px 0 0 var(--extra);padding-left:10px;background:rgba(164,69,42,.05)}
input.missing{border-color:var(--extra);box-shadow:0 0 0 1px var(--extra)}
.ubtns{display:flex;gap:10px;flex-wrap:wrap}
.ubtn{background:var(--acc);border-color:var(--acc);color:var(--on-acc);min-width:10em}
.codecard.picked{outline:3px solid var(--acc);outline-offset:-1px}
.codecard .pickno{color:var(--acc);font-weight:700}
.clock{text-align:right;font-size:13px;color:var(--muted)}
.clock b{display:block;font-family:var(--f-head);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.stabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.stab{appearance:none;flex:0 0 auto;border:1px solid var(--line);border-top:4px solid var(--acc);background:var(--surface);border-radius:4px;padding:6px 14px;cursor:pointer;text-align:left}
.stab .code{display:block;font-size:18px}
.stab small{font-size:11px;color:var(--muted)}
.stab.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.stab.on small{color:var(--on-acc)}
.spanel{display:none}
.spanel.on{display:block}
.done-note{background:var(--surface);border:1px dashed var(--line);border-radius:4px;padding:20px;margin-bottom:16px}
.tblwrap{overflow-x:auto}
.stbl{border-collapse:collapse;font-size:14px;min-width:100%}
.stbl th,.stbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap;vertical-align:top}
.stbl tbody th small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:normal;max-width:14em}
.stbl td{font-variant-numeric:tabular-nums;font-weight:700}
.stbl td.na{color:var(--muted);font-weight:400}
.stbl tr.sum th,.stbl tr.sum td{border-top:2px solid var(--ink)}
.stbl small{font-weight:400;color:var(--muted);font-size:11px}
.showoff{max-width:520px}
.so-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.so-row .code{font-size:20px;min-width:4.2em;color:var(--acc)}
.so-name{flex:1;font-size:15px;line-height:1.4}
.so-name small{display:block;color:var(--muted);font-size:12px}
.so-row b{font-family:var(--f-head);font-size:34px;font-variant-numeric:tabular-nums}
.so-tot{border-bottom:0}
.so-tot span{flex:1;font-weight:700}
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.15);max-height:260px;overflow-y:auto;margin-top:2px}
.ac-item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;font-size:15px;cursor:pointer;color:var(--ink)}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item:focus{background:var(--tint)}
.ac-item small{color:var(--muted);font-size:12px}
.totop{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:12;width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.totop small{font-size:10px;margin-top:2px;color:var(--muted)}
.totop.on{opacity:1;pointer-events:auto}
@media (min-width:641px){.totop{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.modal{position:fixed;inset:0;background:rgba(20,16,18,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.mbox{background:var(--surface);color:var(--ink);border-radius:6px;padding:20px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mbox p{margin:0 0 16px;font-size:15px}
.mbtns{display:flex;gap:10px;justify-content:flex-end}
.mbtns .btn{min-width:6em;line-height:1.3}
.mbtns .btn small{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:1px}
.a2steps{margin:0 0 14px;padding-left:1.3em;font-size:14px}.a2steps li{margin:4px 0}.a2ico{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:13px}
.chips,.seg{position:relative}
.chips input,.seg input{top:0;left:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:10}
#toast.on{opacity:1}
.foot{color:var(--muted);font-size:12px;margin-top:40px}
.foot.copy{margin-top:6px;font-size:11px;opacity:.85}
.qzrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}.qzrow .hint{margin:0 4px 0 0}
details.sec>summary{font-family:var(--f-head);font-weight:600;font-size:16px;padding:2px 0}
.lblrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lblslots{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 2px}
.lblslot{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:150px}
.lblthumb{width:150px;height:150px;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--tint);overflow:hidden}
.lblslot.has .lblthumb{border-style:solid}
.lblthumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
input.lblfilled{border-color:var(--hit);box-shadow:0 0 0 1px var(--hit)}
.lblbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lblbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
@media (max-width:640px){.lblslot{width:calc(50% - 6px)}.lblthumb{width:100%;height:auto;aspect-ratio:1}.lblslot .btn{width:100%}}
.lblbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px}
.lblbtn input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
.labelcap .gnote{font-size:12px;color:var(--muted);margin:10px 0 0}
.srcb{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted);line-height:1.6}
.ro .mchip{cursor:default}
.filters input[type=checkbox]{width:auto;min-width:0;padding:0}
.filters label.check{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tsel{flex-basis:100%;display:flex;flex-direction:column;gap:6px}
.tsel-h{font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:baseline}
.tsel-h .link{font-size:12px}
.tgrp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tgl{font-size:12px;color:var(--muted);width:2em;flex:0 0 auto}
.tchip{appearance:none;font:inherit;font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);color:var(--ink);cursor:pointer}
.tchip.tc-w{--acc:var(--straw)}.tchip.tc-r{--acc:var(--claret)}
.tchip:hover{border-color:var(--acc)}
.tchip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
@media (max-width:640px){.tchip{min-height:36px}}
.offmode{margin:-6px 0 14px}
.gtoc{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 18px;font-size:13px}
.gtoc a{color:var(--muted);text-underline-offset:3px}
.guide .sec{padding-bottom:14px}
.guide .sec>p,.guide .sec>ul,.guide .sec>ol{font-size:14px;margin:10px 0 0}
.guide ul,.guide ol{padding-left:1.3em}
.guide li{margin:3px 0}
.guide h4{font-size:14px;margin:14px 0 4px}
.gtbl{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0 2px}
.gtbl th,.gtbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;line-height:1.55}
.gtbl thead th{background:var(--tint);font-weight:700}
.gtbl tbody th{font-weight:700;white-space:nowrap;min-width:5em}
.gtbl .q{width:50%}
.gnote{font-size:12px;color:var(--muted);margin-top:8px}
.gk{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:1px 2px;white-space:nowrap}
@media (max-width:640px){.gtbl{font-size:12px}.gtbl th,.gtbl td{padding:5px 6px}.gtbl tbody th{white-space:normal}}
.layseg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.layseg .btn{min-width:0}
.ressheet>summary{font-weight:700;font-size:15px;padding:4px 0 10px}
.t-plain{color:var(--muted);border:1px solid var(--line)}

@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:0 14px}
  .top .wrap{padding-top:18px}
  h1{font-size:22px}
  .sub{font-size:12px;margin-bottom:8px}
  nav{gap:0}
  nav button{flex:1;padding:10px 4px 11px;font-size:14px}
  main{padding-top:20px}
  h2{font-size:20px}
  input[type=text],input[type=number],input[type=date],input:not([type]),textarea,select{font-size:16px;padding:10px 12px}
  .opencode{max-width:none}
  .codes{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .codecard{padding:10px 12px}
  .codecard .code{font-size:21px}
  .sec{padding:14px 14px 6px;margin-bottom:12px}
  .item{grid-template-columns:1fr;gap:8px;padding:12px 0}
  .item-h{flex-direction:row;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
  .grp{flex-direction:column;gap:4px}
  .grp-n{width:auto;padding-top:0}
  .chips{gap:7px}
  .chips label,.mchip{min-height:38px;padding:6px 13px;font-size:14px}
  .fields{grid-template-columns:1fr;gap:12px}
  .formhead .code{font-size:28px}
  .submitbar{position:sticky;bottom:0;background:var(--paper);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin:0 -14px;padding-left:14px;padding-right:14px;border-top:1px solid var(--line);z-index:5}
  .submitbar .btn{width:100%;padding:13px}
  .btn{min-height:40px}
  .btn.small{min-height:34px}
  .scorehead{gap:10px;margin-bottom:14px}
  .bigscore{font-size:48px}
  .winecard{padding:14px 16px}
  .winecard dl{grid-template-columns:5em 1fr}
  .rrow{grid-template-columns:1fr auto;gap:4px 10px}
  .rrow .rl{grid-column:1}.rrow .rs{grid-column:2;grid-row:1}
  .rrow .ry,.rrow .rm{grid-column:1/-1}
  .rrow.head{display:none}
  .cap{display:inline-block;width:2.6em}
  .wrow{grid-template-columns:1fr auto;padding:12px 12px;gap:8px 10px}
  .wrow .wn{grid-column:1/-1;grid-row:2}
  .wrow .wacts{grid-column:1/-1;justify-content:stretch}
  .wrow .wacts .btn{flex:1}
  .vialtog{padding:8px 14px;font-size:14px}
  .filters label{flex:1 1 40%}
  .filters select,.filters input{width:100%}
  .filters .wide{flex-basis:100%}
  .headrow .tools{width:100%;justify-content:space-between}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{padding:10px 12px}
  .stat b{font-size:24px}
  .bar{grid-template-columns:7.5em 1fr 2.8em;gap:8px}
  .hrow{grid-template-columns:auto 1fr auto;padding:10px 12px;gap:2px 10px}
  .hrow .d{grid-column:1/-1;font-size:12px;color:var(--muted)}
  .hrow .code{font-size:15px}
  .others li{flex-direction:column;gap:2px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

.codecard .wnm{color:var(--ink);font-size:12px;line-height:1.5;margin:2px 0}

/* scenery & marks */
:root{--scene:rgba(124,32,53,.22);--scene-fill:rgba(124,32,53,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--scene:rgba(218,122,143,.17);--scene-fill:rgba(218,122,143,.06)}}
:root[data-theme="dark"]{--scene:rgba(218,122,143,.17);--scene-fill:rgba(218,122,143,.06)}
.top{position:relative;z-index:1}
.top .wrap{position:relative}
.sprig{position:absolute;right:20px;top:16px;width:78px;height:auto;color:var(--claret);opacity:.45;pointer-events:none}
.sprig .s-leaf{fill:var(--straw);fill-opacity:.16}
@media (max-width:540px){.sprig{width:52px;right:14px;top:12px;opacity:.35}}
main{position:relative;z-index:1}
@media print{.sprig{display:none}}
.ebadge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:#000;color:#fff;font-family:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;font-weight:700;font-size:12px;line-height:1;border-radius:2px;margin-right:7px;vertical-align:2px;flex:none;letter-spacing:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ebadge{box-shadow:0 0 0 1px rgba(255,255,255,.4)}}
:root[data-theme="dark"] .ebadge{box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.wnm .ebadge{width:14px;height:14px;font-size:10px;margin-right:4px;vertical-align:1px}

.hitem{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.hitem .hrow{flex:1;min-width:0;border-bottom:0}
.hinc{display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12px;color:var(--muted);white-space:nowrap;border-left:1px solid var(--line);cursor:pointer}
.hinc input{margin:0}
.hitem.off .hrow{opacity:.5}
.hitem.off .hrow .sc{text-decoration:line-through}
@media (max-width:540px){.hinc{padding:0 10px;flex-direction:column;justify-content:center;gap:2px;font-size:11px;text-align:center;white-space:normal;width:4.6em}}

/* background photo */
:root{--veil-top:rgba(243,243,239,.86);--veil-bot:rgba(243,243,239,.74);--surface-a:rgba(255,255,255,.84)}

:root[data-theme="dark"]{--veil-top:rgba(23,21,26,.88);--veil-bot:rgba(23,21,26,.8);--surface-a:rgba(33,30,36,.86)}

/* ===== black luxury theme (always on) ===== */
:root,:root[data-theme="light"],:root[data-theme="dark"]{--paper:#0D0C0B;--surface:#171513;--ink:#EEE7DA;--muted:#A69C8D;--line:#363029;--claret:#CF6A80;--straw:#D6B66F;--on-acc:#0D0C0B;--hit:#7DC69B;--extra:#E58C6B;--near:#E2B95A;--tint:rgba(238,231,218,.05);--gold:#C9A96A;--gold-soft:rgba(201,169,106,.35);--veil-top:rgba(13,12,11,.72);--veil-bot:rgba(13,12,11,.42);--surface-a:rgba(13,12,11,.72);color-scheme:dark;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0D0C0B;--surface:#171513;--ink:#EEE7DA;--muted:#A69C8D;--line:#363029;--claret:#CF6A80;--straw:#D6B66F;--on-acc:#0D0C0B;--hit:#7DC69B;--extra:#E58C6B;--near:#E2B95A;--tint:rgba(238,231,218,.05);--gold:#C9A96A;--gold-soft:rgba(201,169,106,.35);--veil-top:rgba(13,12,11,.72);--veil-bot:rgba(13,12,11,.42);--surface-a:rgba(13,12,11,.72);color-scheme:dark;}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--paper:#0D0C0B;--surface:#171513;--ink:#EEE7DA;--muted:#A69C8D;--line:#363029;--claret:#CF6A80;--straw:#D6B66F;--on-acc:#0D0C0B;--hit:#7DC69B;--extra:#E58C6B;--near:#E2B95A;--tint:rgba(238,231,218,.05);--gold:#C9A96A;--gold-soft:rgba(201,169,106,.35);--veil-top:rgba(13,12,11,.72);--veil-bot:rgba(13,12,11,.42);--surface-a:rgba(13,12,11,.72);color-scheme:dark;}}
body{background:var(--paper);color:var(--ink);letter-spacing:.02em}
.top{border-bottom:1px solid var(--gold-soft)}
h1{color:var(--gold);font-weight:600;letter-spacing:.14em}
.sub{color:var(--muted);letter-spacing:.08em}
h2,h3{color:var(--ink);letter-spacing:.08em}
nav button[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold)}
nav button:hover{color:var(--ink)}
.btn{background:var(--gold);border-color:var(--gold);color:#0D0C0B;letter-spacing:.06em}
.btn:hover:not(:disabled){background:#D9BC80;border-color:#D9BC80}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--gold-soft)}
.btn.ghost:hover:not(:disabled){border-color:var(--gold);color:var(--gold);background:transparent}
.btn.danger{background:transparent;color:var(--extra);border-color:var(--extra)}
.link{color:var(--muted)}.link:hover{color:var(--gold)}
:focus-visible{outline-color:var(--gold)}
.sprig{color:var(--gold);opacity:.55}
.sprig .s-leaf{fill:var(--gold);fill-opacity:.08}
.ebadge{background:#000;color:#fff;box-shadow:0 0 0 1px var(--gold-soft)}
.modal{background:rgba(0,0,0,.66)}
.ac-list{box-shadow:0 10px 28px rgba(0,0,0,.55)}
.sw{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.star.on{color:var(--gold)}
input,select,textarea{color-scheme:dark}
input[type=url]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold-soft)}

/* ===== metallic gold ===== */
:root{--gm:linear-gradient(115deg,#7E5E26 0%,#C9A14E 18%,#F4E2A4 34%,#B8893A 50%,#EBD18A 66%,#9A7330 82%,#D9BB6E 100%);--gm-line:linear-gradient(90deg,transparent 0%,#7E5E26 12%,#E9CF8B 38%,#FFF1C2 50%,#E9CF8B 62%,#7E5E26 88%,transparent 100%)}
h1{background:var(--gm);background-size:160% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.top{border-bottom:1px solid transparent;border-image:var(--gm-line) 1}
nav button[aria-current="page"]{background:var(--gm);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;border-bottom:2px solid transparent;border-image:var(--gm) 1}
.btn{background:var(--gm);background-size:220% 100%;background-position:0 0;border:1px solid #9A7330;color:#1A1408;text-shadow:0 1px 0 rgba(255,240,200,.45);box-shadow:inset 0 1px 0 rgba(255,248,220,.55),inset 0 -1px 0 rgba(60,40,10,.35),0 1px 2px rgba(0,0,0,.5);transition:background-position .5s ease}
.btn:hover:not(:disabled){background:var(--gm);background-size:220% 100%;background-position:100% 0;border-color:#B8893A}
.btn.ghost{background:transparent;color:var(--ink);text-shadow:none;box-shadow:none;border:1px solid var(--gold-soft)}
.btn.ghost:hover:not(:disabled){background:transparent;border-color:#D9BB6E;color:#EBD18A}
.btn.danger{background:transparent;text-shadow:none;box-shadow:none;border:1px solid var(--extra);color:var(--extra)}
.btn.danger:hover:not(:disabled){background:transparent;border-color:var(--extra)}
.star.on{background:var(--gm);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.ebadge{box-shadow:0 0 0 1px #B8893A,0 0 0 2px rgba(0,0,0,.6)}
.sprig{opacity:.7}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* sommelier badge */
.sprig.badge{width:54px;height:auto;top:12px;right:22px;opacity:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.75))}
@media (max-width:540px){.sprig.badge{width:42px;top:10px;right:14px}}

/* badge with ribbon */
.sprig.badge{width:110px;top:2px;right:12px}
.top h1,.top .sub{padding-right:124px}
@media (max-width:540px){.sprig.badge{width:80px;top:8px;right:6px}.top h1,.top .sub{padding-right:84px}}
</style>
</head>

function judge(it, mine, model, alt = []) {
  const left = [...model], marks = {}; let pts = 0;

  mine.forEach(t => { if (marks[t]) return; if (alt.includes(t) && left.length) { left.pop(); marks[t] = 'alt'; pts += ALT_W; } });
  mine.forEach(t => {
    if (marks[t]) return;

    if (j >= 0) { left.splice(j, 1); marks[t] = 'near'; pts += NEAR_W; } else marks[t] = 'extra';
  });
  return { s: pts / Math.max(model.length, mine.length || 1), marks, missed: left };
}

function varietyScore(input, truth) {

  if (m[0] === t[0]) return { pts: W_VAR, max: W_VAR, label: '正解' };
  if (m.some(x => t.includes(x))) return { pts: W_VAR / 2, max: W_VAR, label: '補助品種が一致' };

const KEY = 'tasting-friend-answers-v1';
const S = { tab:'practice', view:{ name:'home' }, answers:[], stored:true, dirty:false, showNames:false };
try { S.answers = JSON.parse(localStorage.getItem(KEY) || '[]'); if (!Array.isArray(S.answers)) S.answers = []; } catch (e) { S.answers = []; S.stored = false; }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S.answers)); } catch (e) { S.stored = false; } }
const SKEY = 'tasting-friend-sessions-v1';
try { S.sessions = JSON.parse(localStorage.getItem(SKEY) || '[]'); if (!Array.isArray(S.sessions)) S.sessions = []; } catch (e) { S.sessions = []; }
function persistS() { try { localStorage.setItem(SKEY, JSON.stringify(S.sessions)); } catch (e) { S.stored = false; } }
(function () { const PK = 'tasting-friend-presets-v1'; let done = []; try { done = JSON.parse(localStorage.getItem(PK) || '[]'); } catch (e) {} if (!Array.isArray(done)) done = [];
  let added = false; (DATA.sessions || []).forEach(x => { if (!done.includes(x.id) && !S.sessions.some(y => y.id === x.id)) { S.sessions.push({ ...x }); done.push(x.id); added = true; } });
  if (added) { persistS(); try { localStorage.setItem(PK, JSON.stringify(done)); } catch (e) {} } })();
/* ---------- 自分で登録したワイン（このブラウザだけに保存） ---------- */
const MKEY = 'tasting-friend-mywines-v1';
try { S.myWines = JSON.parse(localStorage.getItem(MKEY) || '[]'); if (!Array.isArray(S.myWines)) S.myWines = []; } catch (e) { S.myWines = []; }
function persistW() { try { localStorage.setItem(MKEY, JSON.stringify(S.myWines)); } catch (e) { S.stored = false; } }
/* 出題で取り込んだワインは、共有のワイン（作成時点の写し）より新しい情報として優先する */
const allWines = () => { const imp = new Set(S.myWines.filter(w => w.imported).map(w => w.code)); return DATA.wines.filter(w => !imp.has(w.code)).concat(S.myWines); };
S.drafting = {};
function newCode(color) {
  const A = 'ACDEFHJKLMNPRTUVWXY34679', all = allWines();
  for (;;) { let c = (color === 'r' ? 'R' : 'W') + '-'; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; if (!all.some(w => w.code === c)) return c; }
}
const modelStat = w => S.drafting[w.id] ? 'AIが調べて下書き中…' : !hasModel(w) ? '模範解答 未作成' : (w.mine && w.model.source === 'ai-auto') ? '模範解答 AI下書き（未確認）' : '模範解答あり';

/* ワインリスト */
const WL_DEF = { color: '', src: '', model: '' };
function viewWines() {
  const f = S.wlf || (S.wlf = { ...WL_DEF }), opt = (v, l, cur) => `<option value="${v}"${cur === v ? ' selected' : ''}>${l}</option>`;
  const ws = allWines().filter(w => (!f.color || w.color === f.color) && (!f.src || (f.src === 'quiz' ? !!w.imported : f.src === 'mine' ? !!w.mine : !w.mine && !w.imported)) && (!f.model || (f.model === 'none' ? !hasModel(w) : hasModel(w))))
    .sort((a, b) => (!!b.mine - !!a.mine) || (a.mine ? (b.at || 0) - (a.at || 0) : String(a.code).localeCompare(String(b.code))));
  const row = w => `<div class="wrow sheet-${w.color}${w.avail === false ? ' novial' : ''}">
      <span class="code">${h(w.code)}</span>
      <span class="wn">${S.showNames ? `${w.enoteca ? EB : ''}${h(w.name)}<small>${h([w.producer, w.country, w.vintage].filter(Boolean).join('、'))}</small>` : `<span class="hidden-name">非表示</span><small>${colorLabel(w.color)}ワイン</small>`}
        <small><span class="srcb">${w.mine ? '自分で登録' : w.imported ? '出題' + (w.from ? '（' + h(w.from) + '）' : '') : '共有'}</span> <span class="mstat${hasModel(w) && !(w.mine && w.model.source === 'ai-auto') ? ' ok' : ''}">${modelStat(w)}</span></small></span>
      ${w.mine ? `<label class="vialtog${w.avail !== false ? ' on' : ''}"><input type="checkbox" data-myvial="${w.id}"${w.avail !== false ? ' checked' : ''}>在庫${w.avail !== false ? 'あり' : 'なし'}</label>` : `<span class="vialtog${w.avail !== false ? ' on' : ''}" style="cursor:default">在庫${w.avail !== false ? 'あり' : 'なし'}</span>`}
      <span class="wacts"><button class="btn ghost small" data-act="modelOpen" data-id="${w.id}"${lockedFor(w.id) ? ' title="まとめて回答で提出するまで見られません"' : ''}>${lockedFor(w.id) ? '🔒 模範解答' : '模範解答'}</button>${w.mine ? `<button class="btn ghost small" data-act="editWine" data-id="${w.id}">編集</button>` : ''}${w.imported ? `<button class="btn danger small" data-act="qiDel" data-id="${w.id}">削除</button>` : ''}</span>
    </div>`;
  return `<div class="headrow"><div><h2>ワインリスト</h2><p class="hint" style="margin:0">共有のワインと出題で届いたワインは閲覧のみです。自分で買ったワインを登録すると、この端末にだけ保存され、小瓶用のコードが発行されます。</p></div>

/* AIの下書き */
function draftPrompt(w, ref) {
  const opts = ITEMS[w.color].map(it => `- ${it.k}（${it.l}、目安${it.p}つ）: ${TERMS(it).join(' / ')}`).join('\n');
  return `あなたはJSA（日本ソムリエ協会）ソムリエ／ワインエキスパート2次試験のテイスティング指導者です。
次のワインの模範解答を、解答用紙の選択肢の中から選んでください。

# ワイン
色: ${colorLabel(w.color)}ワイン
銘柄: ${w.name}
生産者: ${w.producer || '不明'}
生産国・産地: ${w.country}${w.region ? '、' + w.region : ''}
品種: ${w.varieties}
収穫年: ${w.vintage || '不明'}
アルコール度数: ${w.abv ? w.abv + '%' : '不明'}
メモ: ${w.memo || 'なし'}

# 参考情報（生産者資料や商品ページから利用者が貼り付けたもの）
${ref ? String(ref).slice(0, 8000) : 'なし'}

# 選択肢（項目キー（項目名、選ぶ数の目安）: 選択肢）
${opts}

# ルール
- 選択肢の文字列を一字一句そのまま使う。
- 選ぶ数は目安の範囲に収める。目安が1の項目は必ず1つだけ選ぶ。
- 参考情報にない点は、品種・産地・収穫年・アルコール度数から典型的なスタイルを推定して選ぶ。試験で想定される模範的な解答を優先する。
- 外観・香り・味わいの印象、評価、適正温度、グラスはワイン全体のスタイルと矛盾しないようにする。
- 正解の数はワインに合わせて目安の範囲内で決め、極端に増やしたり減らしたりしない（果実・花・植物は4つ前後で果実3つ＋花1つなど、香辛料・芳香・化学物質は白3つ・赤4つ前後）。正解には最も自信のある推奨用語だけを入れる。
- 品種の個性的な香りより、どの品種でも外れにくい無難な用語を優先する（試験の傾向）。
- 試験でよく使われる傾向: 清澄度は澄んだ、輝きは輝きのある。白の色調はグリーンがかった＋レモンイエロー（濃いめならイエロー）。白の第一印象は開いている（弱ければ控えめ）＋フレッシュな、アロマティック品種なら華やかな。果実は熟度の並びで連続した用語を選び、飛び飛びにしない。白のミネラルは石灰・貝殻が基本（樽が強いワインやアロマティック品種を除く）。樽があればトースト、新世界ならヴァニラも。白の酸味は爽やかなが基本、苦味は迷えば穏やかな。赤の色調は透けるならルビー・ラズベリーレッド、濃ければガーネット・ダークチェリーレッド、若ければ紫がかった、熟成ならオレンジがかった。赤の花は必ず1つ（若ければスミレ、温暖なら牡丹）。赤の香辛料はロースト、ナツメグ、シナモン、甘草が外れにくい。赤のタンニンは迷えば緻密、酸味は迷えばなめらかな、甘みは迷えばまろやか。赤の適正温度は渋みが強ければ17〜20度、ピノ・ノワールなど渋みが少なければ14〜16度。ネッビオーロ・テンプラニーリョ・サンジョヴェーゼは熟成感が現れている、干しプラムが選ばれやすい。
- alt（別解）には、推奨ほどではないが妥当な用語を入れる（選ぶと7割の点）。協会の模範解答は1項目に多くの用語を認める傾向があるので、果実・花・植物や香辛料では3〜6つ程度まで入れてよいが、明らかに外れている用語は入れない。

# 出力
JSONのみ: {"sel":{"項目キー":["選択肢"]},"alt":{"項目キー":["選択肢"]},"rationale":"選択の根拠と、このワインを見分けるポイントを日本語で200〜300字。参考情報にない推定部分はそう明記する"}`;
}
function parseDraft(color, res) {
  const sel = {}, alt = {};
  ITEMS[color].forEach(it => {
    const ok = TERMS(it), nz = t => String(t).normalize('NFKC').replace(/[\s　・･]/g, '').replace(/[〜～~]/g, '〜').replace(/[「」"']/g, '');
    const map = new Map(ok.map(t => [nz(t), t]));
    const pick = o => [...new Set((o && Array.isArray(o[it.k]) ? o[it.k] : []).map(t => ok.includes(String(t)) ? String(t) : map.get(nz(t))).filter(Boolean))];
    let a1 = pick(res && res.sel); if (it.p === 1) a1 = a1.slice(0, 1);
    const a2 = pick(res && res.alt).filter(t => !a1.includes(t)).slice(0, 8);
    if (a1.length) sel[it.k] = a1;
    if (a1.length && a2.length) alt[it.k] = a2;
  });
  return { sel, alt };
}
/* ---------- Webで調べる（Gemini の Google 検索・URL読み取り） ---------- */
function researchPrompt(w, url) {

# ワイン
銘柄: ${w.name || '不明'}
生産者: ${w.producer || '不明'}
生産国・産地: ${[w.country, w.region].filter(Boolean).join('、') || '不明'}
品種: ${w.varieties || '不明'}

${url ? '商品ページ等のURL: ' + url : ''}
# 調べること
1. テクニカル情報: 品種構成（比率）、畑・土壌、醸造（発酵容器、マロラクティック発酵、樽熟成の有無・期間・新樽率）、アルコール度数
2. テイスティングコメント: 外観（色調・濃淡）、香り（果実・花・スパイス・樽・熟成香）、味わい（甘み・酸味・タンニン・ボディ・余韻）
3. 生産者やこのキュヴェの特徴、このヴィンテージの作柄
# ルール

- 検索で確認できた事実と推定を区別する。このヴィンテージの情報が見つからず、他のヴィンテージや産地一般の情報で補った部分は「（他ヴィンテージの情報）」「（産地一般の傾向）」と明記する。
- 該当するワインが見つからなければ、最初の行に「該当するワインの情報は見つかりませんでした。」と書いたうえで、産地と品種の一般的な特徴をまとめる。`;
}
const srcLines = r => (r && r.sources && r.sources.length ? '\n出典: ' + r.sources.map(x => (x.title ? x.title + ' ' : '') + x.uri).join('\n　') : '');
async function webResearch(w, url) {
  const r = await S.sample.text(researchPrompt(w, url), { search: true, urls: !!url });
  const t = String(r.text || '').trim();
  if (!t) throw gErr('failed', 'empty');
  return `【Webで調べた情報（Gemini・${new Date().toLocaleDateString('ja-JP')}）】\n${t}${srcLines(r)}`;
}
const hasWebRef = ref => /【Webで調べた情報/.test(String(ref || ''));
async function draftWithRetry(w, ref) {
  let last;
  for (let i = 0; i < 2; i++) {
    try { const res = await S.sample.json(draftPrompt(w, ref), { cache: false }); const pd = parseDraft(w.color, res); if (Object.keys(pd.sel).length) return { res, ...pd }; last = gErr('empty'); }
    catch (e) { last = e; if (!['invalid_json', 'empty', 'failed', 'rate_limited'].includes(e && e.code)) break; await new Promise(r => setTimeout(r, 2500)); }
  }
  throw last;
}
async function autoDraft(id) {
  const w0 = wine(id); if (!S.sample || !w0 || !w0.mine) return;
  S.drafting[id] = true; if (!isForm()) render();
  try {
    if (!hasWebRef(w0.reference)) {
      try { const add = await webResearch(w0, w0.url || ''); const c0 = wine(id); if (c0) { c0.reference = [String(c0.reference || '').trim(), add].filter(Boolean).join('\n\n'); persistW(); } }
      catch (e) { /* 検索できなくても、手元の情報で下書きを作る */ }
    }
    const wNow = wine(id) || w0;
    const { res, sel, alt } = await draftWithRetry(wNow, wNow.reference || '');
    const cur = wine(id); if (!cur || hasModel(cur)) return;
    cur.model = { sel, alt, rationale: String((res && res.rationale) || ''), at: Date.now(), source: 'ai-auto' }; persistW();
    toast(`${cur.code} の模範解答をAIが下書きしました。ワインリストで確認できます。`);
  } catch (e) {
    if (!(e && e.code === 'cancelled')) toast(`${w0.code} の模範解答を自動で作れませんでした（${aiErrText(e).slice(0, 60)}）。ワインリストの「模範解答」から作成してください。`);
  } finally { delete S.drafting[id]; if (!isForm()) render(); }
}
const aiErr = (e, what) => { const c = e && e.code;
  return c === 'not_granted' || c === 'sampling_disabled' ? `AIの設定（招待コードまたはAPIキー）が未設定か無効なため、${what}。手動で入力してください。`
    : c === 'image_rejected' ? 'この画像は読み取れませんでした。別の画像を選ぶか、本文を貼り付けてください。'

    : c === 'invalid_json' ? 'AIの返答を読み取れませんでした。もう一度試してください。'
    : `${what}。もう一度試すか、手動で入力してください。`; };

  </section>

  <section class="sec" id="g-sweet"><h3>甘みとアルコールのボリューム感</h3>
    <p>この用紙の「甘み」は、<b>残糖の甘さとアルコールのボリューム感を合わせた評価</b>です。ほとんどのワインは辛口なので、実際には「アルコールがどれだけ丸みや厚みを出しているか」を答えます。舌先にはっきり甘さを感じるときだけ「残糖がある」を選びます。</p>
    <table class="gtbl"><thead><tr><th>アルコール</th><th>粘性の目安</th><th>甘みの目安（辛口の場合）</th></tr></thead><tbody>
      <tr><th>12%未満</th><td>さらっとした</td><td>ドライ</td></tr>
      <tr><th>12〜13%未満</th><td>さらっとした〜適度な</td><td>ドライ〜ソフトな</td></tr>
      <tr><th>13〜14%未満</th><td>適度な〜やや強い</td><td>ソフトな〜まろやか</td></tr>
      <tr><th>14%以上</th><td>やや強い〜ねっとり（強い）</td><td>まろやか〜豊かな</td></tr>
    </tbody></table>
    <ul>
      <li><b>白</b>：酸がはっきりしていると口当たりが締まり、ドライ寄りになります。「まろやか」は、酸が穏やかで13.5%を超えるような白（樽ありシャルドネ、ヴィオニエなど）向けの言葉です。</li>
      <li><b>赤</b>：渋みでドライに感じやすいですが、温暖な新世界の14%級は、アルコールのボリュームで「まろやか」になります。</li>
      <li>産地の常識も使います。温暖な新世界は13.5〜14%以上、冷涼な産地や軽い旧世界のワインは12〜13%が目安です。</li>
    </ul>
  </section>

  <section class="sec" id="g-attack"><h3>アタック</h3>
    <p>口に含んだ瞬間の<b>ワイン全体の強さ</b>（濃縮感とアルコール）です。外観の答えとそろえます。</p>
    <table class="gtbl"><thead><tr><th>外観・アルコール</th><th>アタック</th></tr></thead><tbody>
      <tr><td>淡い色、さらっとした粘性、12.5%前後</td><td>軽い／やや軽い</td></tr>
      <tr><td>中程度の色、13%前後</td><td>やや軽い／やや強い</td></tr>
      <tr><td>濃い色、強い粘性、14%以上</td><td>やや強い／強い</td></tr>
    </tbody></table>
    <p>「やや強い」を基本の答えにせず、<b>「やや軽い」から考え始めて、根拠があれば上げる</b>のが安全です。「インパクトのある」はめったに選びません。</p>
    <h4>酸の強さとアタックは別に考える</h4>
    <p>酸がはっきりしていると口の中で「鋭さ」を感じるので、アタックを強めにとりがちです。でもアタックは<b>量感（濃縮感・アルコール・厚み）</b>の評価で、酸は「酸味」の項目で答えます。</p>
    <table class="gtbl"><thead><tr><th>ワインの例</th><th>アタック</th><th>酸味</th></tr></thead><tbody>
      <tr><td>ミュスカデ、ドイツのリースリング（Dr.Lなど）</td><td>軽い／やや軽い</td><td>はつらつとした／力強い</td></tr>
      <tr><td>ボージョレ（ガメイ）</td><td>やや軽い</td><td>爽やかな</td></tr>
      <tr><td>ヴィオニエ、温暖産地のメルロ</td><td>やや強い</td><td>なめらかな</td></tr>
      <tr><td>樽ありの新世界シャルドネ</td><td>やや強い／強い</td><td>爽やかな</td></tr>
    </tbody></table>
    <p class="gnote">確かめ方：口に含んだ瞬間に「重さ・厚み」を感じるか（アタック）と、数秒後に唾液がじわっと出るか（酸味）を、分けて意識します。</p>
  </section>

  <section class="sec" id="g-bal"><h3>バランス</h3>
    <p>バランスは単独で感じ取ろうとせず、<b>それまでに答えた甘み・酸味（赤はタンニンも）から組み立てます</b>。1つか2つ選ぶ場合が多く、2つ選ぶときは同じ位置の言葉どうしにします。</p>
    <h4>白：甘み（ボリューム）と酸味の組み合わせ</h4>
    <table class="gtbl"><thead><tr><th></th><th class="q">甘み・ボリュームが小さい</th><th class="q">甘み・ボリュームが大きい</th></tr></thead><tbody>
      <tr><th>酸が強い</th><td>${k('スリムな ドライな 抑制された')}</td><td>${k('ジューシーな 豊潤な 厚みのある')}</td></tr>
      <tr><th>酸が穏やか</th><td>${k('スムーズな コンパクトな')}</td><td>${k('まろやかな ねっとりした')}</td></tr>
    </tbody></table>
    <h4>赤：甘み・酸味・タンニンの3つの組み合わせ</h4>
    <table class="gtbl"><thead><tr><th>特徴</th><th>言葉</th><th>例</th></tr></thead><tbody>
      <tr><th>酸とタンニンが強く、甘み（ボリューム）は控えめ</th><td>${k('スマートな 骨格のしっかりとした 堅固な')}</td><td>冷涼産地のカベルネ、ボルドー、サンジョヴェーゼ</td></tr>
      <tr><th>甘み（ボリューム）とタンニンが強く、酸は穏やか</th><td>${k('豊満な 力強い ジューシーな')}</td><td>温暖産地のシラーズ、ジンファンデル</td></tr>
      <tr><th>タンニンが少なく、なめらか</th><td>${k('流れるような ふくよかな')}</td><td>ピノ・ノワール、ガメイ（流れるような）、温暖産地のメルロ（ふくよかな）</td></tr>
    </tbody></table>
    <p class="gnote">「痩せた、渇いた」は欠点に近い表現なので、まず選びません。</p>
  </section>

  <section class="sec" id="g-set"><h3>セットで選ぶ・そろえる組み合わせ</h3>
    <table class="gtbl"><thead><tr><th>この答えなら</th><th>こちらもそろえる</th></tr></thead><tbody>
      <tr><td>色調</td><td>補助用語とメイン用語を<b>1つずつ</b>。白の若いワインは「グリーンがかった＋レモンイエロー」、赤の若いワインは「紫がかった＋ルビー（またはダークチェリーレッド）」、熟成した赤は「オレンジがかった＋ガーネット」が典型</td></tr>
      <tr><td>濃淡「淡い」</td><td>外観の印象「軽快な」、アタック「軽い／やや軽い」</td></tr>
      <tr><td>濃淡「濃い」</td><td>外観の印象「成熟度が高い」「濃縮感がある（強い）」</td></tr>
      <tr><td>粘性</td><td>アルコールと甘みを同じ方向に（さらっと＝低め、やや強い＝高め）</td></tr>
      <tr><td>外観の印象「若々しい」</td><td>香りの印象（熟成感）も「若々しい」</td></tr>
      <tr><td>香りに「トースト」「ヴァニラ」「ロースト」</td><td>香りの印象「木樽からのニュアンス」。甘み・ボリュームはやや高め</td></tr>
      <tr><td>香りに「パン・ド・ミ」「乳製品」、赤の「バナナ」的な香り</td><td>香りの印象「第2アロマが強い」</td></tr>
      <tr><td>品種の香りがはっきり（ソーヴィニヨン・ブラン、ミュスカ、若い赤）</td><td>香りの印象「第1アロマが強い」</td></tr>
      <tr><td>評価</td><td>適正温度・グラスと同じ重さにそろえる（下の「評価・温度・グラス」）</td></tr>
      <tr><td>グラス</td><td>大きさと形を<b>1つずつ</b>選ぶ</td></tr>
    </tbody></table>
    <h4>品種の決め手になりやすい香り</h4>
    <ul>
      <li>${k('ペトロール（ケロセン）')} → リースリング（特に熟成したもの、豪州産）</li>
      <li>${k('白胡椒')} → グリューナー・ヴェルトリーナー、${k('黒胡椒')} → シラー</li>
      <li>${k('ライチ 白バラ')} → ゲヴュルツトラミネール、${k('マスカット')} → ミュスカ、トロンテス</li>
      <li>${k('パッションフルーツ ハーブ')} → ソーヴィニヨン・ブラン、${k('ピーマン')} → カベルネ系、カルメネール</li>
      <li>${k('ユーカリ メントール')} → 豪州やチリのカベルネ、シラーズ</li>
    </ul>
  </section>

  <section class="sec" id="g-rare"><h3>基本的に選ばない選択肢</h3>
    <p>試験に出るのは健全な若いワインが中心なので、欠点や極端な熟成を表す言葉はまず正解になりません。</p>
    <table class="gtbl"><thead><tr><th>項目</th><th>まず選ばない</th></tr></thead><tbody>
      <tr><th>清澄度・輝き</th><td>${k('やや濁った 濁った ややくすんだ モヤがかった')}（白は「澄んだ」「輝きのある」、赤は「澄んだ」か「深みのある」がほぼ定番）</td></tr>
      <tr><th>色調（白）</th><td>${k('黄金色がかった トパーズ オレンジ（グリ）を帯びた アンバー')}</td></tr>
      <tr><th>色調（赤）</th><td>${k('レンガ マホガニー トパーズ')}</td></tr>
      <tr><th>濃淡</th><td>${k('無色に近い 非常に濃い')}（あてはまるワインはまれ）</td></tr>
      <tr><th>外観の印象</th><td>${k('酸化が進んだ 熟成した 気泡が見える 発泡性')}</td></tr>
      <tr><th>香り</th><td>${k('硫黄 フェノール 麝香 ランシオ ヨード')}</td></tr>
      <tr><th>香りの印象</th><td>${k('嫌気的な 酸化熟成の段階にある 酸化した')}</td></tr>
      <tr><th>味わい</th><td>${k('インパクトのある 強い(突出した) 痩せた、渇いた')}。「残糖がある」は甘口のときだけ、「ねっとりした」「コンパクトな」もまれ</td></tr>
      <tr><th>アルコール・余韻</th><td>${k('11%未満 短い')}（甘口のドイツワインなどは例外）</td></tr>
      <tr><th>評価</th><td>${k('ポテンシャルの高い')}（試験に出る価格帯のワインではまれ）</td></tr>
      <tr><th>適正温度</th><td>白の${k('8度未満 19度以上')}、赤の${k('10度未満 21度以上')}</td></tr>
    </tbody></table>
  </section>

  <section class="sec" id="g-aroma"><h3>第1・第2・第3アロマ</h3>
    <table class="gtbl"><thead><tr><th>分類</th><th>由来</th><th>主な香り</th></tr></thead><tbody>
      <tr><th>第1アロマ</th><td>ブドウそのもの</td><td>果実、花、ハーブ・植物（ピーマン、ミント、杉）、ミネラル。テルペン（マスカット、ライチ、バラ）、チオール（パッションフルーツ）、ピラジン（ピーマン、青草）もここ</td></tr>
      <tr><th>第2アロマ</th><td>発酵（酵母・乳酸菌）</td><td>パン・ド・ミ、ブリオッシュ（澱）、乳製品・バター（乳酸発酵）、バナナ・キャンディ（マセラシオン・カルボニック）</td></tr>
      <tr><th>第3アロマ（ブーケ）</th><td>熟成（樽・瓶）</td><td>樽：トースト、ヴァニラ、ロースト、コーヒー。瓶：キノコ、土、なめし皮、紅茶、蜂蜜、ナッツ、ペトロール</td></tr>
    </tbody></table>
    <p class="gnote">樽の香りは第3アロマに分類されますが、解答用紙では「木樽からのニュアンス」として独立した選択肢になっています。WSETなど他の教え方では樽や乳酸発酵を第2アロマに含めることがありますが、試験は協会の分類に合わせます。</p>
  </section>

  <section class="sec" id="g-eval"><h3>評価・適正温度・グラスのセット（目安）</h3>
    <table class="gtbl"><thead><tr><th>評価</th><th>適正温度</th><th>グラス</th></tr></thead><tbody>
      <tr><td colspan="3"><b>白</b></td></tr>
      <tr><td>シンプル、フレッシュ感を楽しむ</td><td>8〜10度</td><td>小ぶり、チューリップ型</td></tr>
      <tr><td>エレガントでミネラリー</td><td>8〜10度</td><td>中庸、チューリップ型</td></tr>
      <tr><td>なめらかでバランスが良い</td><td>8〜10度／11〜14度</td><td>中庸、チューリップ型</td></tr>
      <tr><td>成熟度が高く豊か（樽ありシャルドネなど）</td><td>11〜14度</td><td>大ぶり（ブルゴーニュ型ならバルーン型）</td></tr>
      <tr><td colspan="3"><b>赤</b></td></tr>
      <tr><td>シンプル、フレッシュ感を楽しむ（ガメイ、軽いMBAなど）</td><td>14〜16度（軽ければ10〜13度）</td><td>中庸、チューリップ型</td></tr>
      <tr><td>エレガントで余韻の長い（ピノ・ノワールなど）</td><td>14〜16度</td><td>大ぶり、バルーン型</td></tr>
      <tr><td>成熟度が高く豊か／濃縮し力強い（カベルネ、シラーズなど）</td><td>17〜20度</td><td>大ぶり、チューリップ型</td></tr>
    </tbody></table>
  </section>
  </div>`;
}

function viewHelp() {
  return `<div class="guide">
  <h2>使い方</h2>
  <p class="hint">Carnet-du-Vin は、ソムリエ・ワインエキスパート2次試験のブラインドテイスティングを練習するための練習帳です。各タブの使い方と注意をまとめています。</p>
  <nav class="gtoc" aria-label="目次">
    <a href="#h-first">はじめに</a><a href="#h-practice">練習する</a><a href="#h-session">まとめて回答</a><a href="#h-quiz">出題</a><a href="#h-unknown">未知のワイン</a>
    <a href="#h-wines">ワインリスト</a><a href="#h-ai">AI設定</a><a href="#h-stats">成績・回答のコツ</a><a href="#h-note">注意事項</a><a href="#h-faq">困ったとき</a>
  </nav>

  <section class="sec" id="h-first"><h3>はじめに</h3>
    <p style="margin-top:10px"><button type="button" class="btn ghost small" data-act="a2hs">ホーム画面に追加する方法</button></p>
    <ul>
      <li><b>最初にホーム画面に追加</b>してください。アプリのようにすぐ開けて、記録も消えにくくなります。iPhoneでは、Safariとホーム画面版で記録の保存場所が別なので、記録を付け始める前に追加するのがおすすめです。</li>
      <li><b>共有のワイン</b>：主催者が用意したワインです。小瓶のラベルには「W-4KX」のようなコードだけが書いてあります。<b>W が白、R が赤</b>です。</li>
      <li><b>出題で届いたワイン</b>：主催者や友人から届いた出題を取り込んだワインです。</li>
      <li><b>自分で登録したワイン</b>：自分で買ったワインを登録して練習に使えます。</li>
      <li><b>保存先</b>：回答、まとめて回答、自分で登録したワインは、<b>いま使っている端末にだけ</b>保存されます。ほかの人には見えず、主催者にも届きません。</li>
    </ul>
  </section>

  <section class="sec" id="h-practice"><h3>練習する（1本ずつ）</h3>
    <ol>
      <li>小瓶のコードを入力して「開く」を押すか、一覧のカードを選びます（「W-」「R-」は省略できます）。</li>
      <li>外観・香り・味わい・評価の用語を選びます。「○つ選ぶ」と数が出ている項目は、その数ちょうどを選びます。本番では超えると0点なので、<b>数を超えては選べません</b>。</li>
      <li>収穫年・生産国・主なブドウ品種を入力して提出すると、「Réponse finale（提出する）」の確認のあとに点数が出ます。</li>
      <li>答え合わせでは、項目ごとの一致率、模範解答、解説を確認できます。別解を選ぶと7割、似た用語は4割の点です。「解答用紙の形で見る」では、自分の回答と模範解答を色分けして重ねて表示します。</li>
    </ol>
    <p class="gnote">一覧は色・タイプ（主品種から自動分類）で絞り込めます。タイプで絞ると品種の見当がつくので、難易度は下がります。ブラインドで練習するときは「銘柄を表示」をオフにしてください。</p>
  </section>

  <section class="sec" id="h-session"><h3>まとめて回答（最大6本）</h3>
    <ol>
      <li>「練習する」の「まとめて回答」で「始める」を押し、グラスに注ぐ順にワインを最大6本選びます。出題を取り込んだ場合は、出題名で自動的に追加されています。</li>
      <li>グラスのコードのタブを切り替えながら回答します。タブを切り替えても入力は消えません。</li>
      <li>1本ずつでも、「入力したワインをまとめて提出」で一度にでも提出できます。「結果を大きく表示して見せ合う」で、みんなで結果を見せ合えます。</li>
    </ol>
    <p class="gnote">🔒の付いたまとめて回答（出題など）では、提出するまでそのワインの答え合わせや模範解答は見られません。</p>
  </section>

  <section class="sec" id="h-quiz"><h3>出題（受け取る・出す）</h3>
    <h4>受け取る</h4>
    <ul>
      <li>Safariなどで使っている人は、届いたリンクを開いて「Oui」を押すだけです。</li>
      <li>ホーム画面に追加した練習帳を使っている人は、届いたリンクを長押ししてコピーし、「ワインリスト」→「届いた出題を取り込む」に貼り付けます（メッセージ全体を貼り付けても大丈夫です）。</li>
      <li>取り込んだワインは「まとめて回答」に追加され、ワインリストには「出題」と表示されます。同じ出題が送り直されたときは、新しい内容に上書きされます。不要になったら、ワインリストの「削除」で消せます。</li>
    </ul>
    <h4>出す</h4>
    <ul>
      <li>「ワインリスト」→「友人に出題する」で、ワインを最大6本選んで「出題リンクを作る」を押し、メッセージをコピーして送ります。</li>
      <li>メッセージには銘柄と模範解答が含まれます。出題する相手にだけ送ってください。</li>
    </ul>
  </section>

  <section class="sec" id="h-unknown"><h3>未知のワイン</h3>
    <ol>
      <li>お店やワイン会など、銘柄がわからないワインを「白ワインを回答」「赤ワインを回答」から先に回答して提出します。</li>
      <li>提出すると「続けてワイン情報を入力しますか？」と出ます。「Oui」でそのまま入力へ、「Plus tard（あとで）」なら「答え合わせ待ち」に残ります。</li>
      <li>ワイン情報を入力して登録すると、AIが模範解答を作り、答え合わせが表示されます。リストにあるワインなら、コードを入力して結び付けることもできます。</li>
    </ol>
  </section>

  <section class="sec" id="h-wines"><h3>ワインリスト・ワインの登録</h3>
    <ul>
      <li><b>登録</b>：「ワインを登録」から、色・銘柄・生産国・品種・収穫年（必須）などを入力すると、小瓶用のコードが発行されます。<b>ラベルにはコードだけを書いて</b>ください。</li>
      <li><b>入力を楽にする3つの方法</b>（AI設定が必要）
        <ul>
          <li><b>表ラベル・裏ラベルの写真</b>：生産者・銘柄・収穫年・産地・品種・アルコール度数を読み取ります。裏ラベルも撮ると、品種や度数の精度が上がります。</li>

    <p class="full hint" style="margin:0">Google AI Studio（aistudio.google.com）で「Get API key」からキーを作成し、貼り付けてください。招待コードとキーの両方がある場合は、最後に保存したほうを使います。無料枠では、送った写真や文章がGoogleのサービス改善に使われる場合があります。</p>
    <label class="full"><span>Gemini APIキー</span><input id="ai-key" type="password" autocomplete="off" spellcheck="false" placeholder="${key ? '設定済み。変更する場合だけ入力' : 'AIza… で始まる文字列'}"></label>
    <div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="aiSave">保存して接続テスト</button>${key ? '<button class="btn danger" data-act="aiClear">キーを削除</button>' : ''}</div>
    <div class="full aistatus" id="ai-set-status"></div></div></details>
  <details class="sec"><summary>モデルの選択</summary><div class="fields" style="padding:10px 0 14px">
    <label class="full"><span>モデル（招待コード・APIキーの両方に適用）</span><select id="ai-model">${GMODELS.map(([v, l]) => `<option value="${v}"${v === model ? ' selected' : ''}>${l}</option>`).join('')}<option value="__custom"${known ? '' : ' selected'}>その他（下に入力）</option></select></label>
    <label class="full"><span>その他のモデル名（任意）</span><input id="ai-model-c" value="${known ? '' : h(model)}" placeholder="例: gemini-2.5-flash" spellcheck="false"></label>
    <div class="full"><button class="btn ghost" data-act="aiModelSave">モデルを保存</button></div></div></details>
  <details class="sec"><summary>主催者向け：招待コードを作る</summary><div class="fields" style="padding:10px 0 14px">
    <p class="full hint" style="margin:0">Apps Scriptで公開したウェブアプリのURL（https://script.google.com/macros/s/…/exec）と、スクリプト プロパティ「PASSCODES」に登録した友人の合言葉を入れると、その友人用の招待コードができます。LINEなどで本人にだけ送ってください。</p>
    <label class="full"><span>ウェブアプリのURL</span><input id="inv-url" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="full"><span>合言葉</span><input id="inv-pass" spellcheck="false" placeholder="例: sakura-7342"></label>
    <div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="invMake">招待コードを作る</button></div>
    <label class="full"><span>招待コード</span><textarea id="inv-out" readonly style="min-height:70px" placeholder="ここに表示されます"></textarea></label>
    <div class="full"><button class="btn ghost small" data-act="invCopy">コピー</button></div></div></details>
  <section class="sec"><h3>注意</h3><ul>
    <li>招待コードは本人専用です。他の人に転送しないでください。主催者は合言葉を消すことで、いつでも利用を止められます。</li>
    <li>主催者のAIは無料枠を全員で分け合っています。同時にたくさん使うと「利用が集中しています」と出ることがあるので、少し時間をおいて試してください。</li>
    <li>無料枠では、送った写真や文章がGoogleのサービス改善に使われる場合があります。ラベルの写真や商品ページの本文以外は送らないでください。</li>
    <li>模範解答の下書きとURLからの読み取りでは、AIがGoogle検索やページの読み取りを使います。検索結果が別のヴィンテージや似た銘柄のこともあるので、読み取り結果や下書きは必ず確認してから保存してください。</li>
  </ul></section></div>`;
}
async function aiTestRun(id) {
  const st = $('#' + (id || 'ai-test-status')); if (st) st.textContent = '接続しています…（10秒ほどかかることがあります）';
  try {
    if (aiMode() === 'relay') { await geminiCall('', { ping: true }); }
    const r = await geminiSample.json('次のJSONだけを返してください: {"ok":true}');
    if (st) st.innerHTML = r && r.ok ? '<b style="color:var(--hit)">接続できました。</b>AI機能を使えます。' : '接続はできましたが、返答が想定と違いました。別のモデルを試してください。';
  } catch (e) { if (st) st.textContent = aiErrText(e); }
}
function aiErrText(e) {
  const c = e && e.code, m = e && e.message && e.message !== c ? `（${e.message.slice(0, 160)}）` : '';
  return c === 'bad_pass' ? '合言葉が違うか、使えなくなっています。主催者に新しい招待コードをもらってください。'
    : c === 'relay_nokey' ? '主催者の中継サーバーにAPIキーが設定されていません。主催者に連絡してください。'
    : c === 'relay_network' || c === 'relay_bad' ? '主催者の中継サーバーに接続できませんでした。インターネット接続を確認するか、主催者に連絡してください。' + m
    : c === 'not_granted' ? 'APIキーが正しくないか、無効になっています。貼り付け間違いがないか確認してください。' + m
    : c === 'model_not_found' ? 'このモデルは使えません。「モデルの選択」で「Gemini Flash 最新版」などに変えてください。' + m
    : c === 'rate_limited' ? '無料枠の上限に達したか、Gemini側が混雑しています（一時的なものです）。少し時間をおいてから試してください。' + m
    : c === 'network' ? 'Geminiに接続できませんでした。インターネット接続を確認してください。ファイルを直接開いていてうまくいかない場合は、ChromeやSafariの最新版で開くか、Webサーバーに置いて開いてください。'
    : '接続できませんでした。' + m;
}
/* URLの #invite=招待コード で開くと自動で設定する */
window.addEventListener('hashchange', () => { if (/invite=|quiz=/.test(location.hash)) location.reload(); });
/* URLの #quiz=出題コード で開くと、出題を取り込む */
(function () { try { const mt = location.hash.match(/quiz=(CDV[01]\.[A-Za-z0-9_-]+)/); if (mt) { history.replaceState(null, '', location.pathname); setTimeout(() => importQuiz(mt[1], true), 500); } } catch (e) {} })();
(function () { try { const mt = location.hash.match(/invite=([A-Za-z0-9._\-]+)/); if (mt && invDecode(mt[1])) { gSet(GINV, mt[1]); gSet(GMODE, 'relay'); history.replaceState(null, '', location.pathname + location.search); S.invJustSet = true; } } catch (e) {} })();
aiApply();
if (!takeResume() && S.sample) { if (!isForm()) render(); }
if (S.invJustSet) setTimeout(() => toast('招待コードを設定しました。AI機能を使えます。'), 400);
/* ---------- ホーム画面に追加（最初に開いたときに案内） ---------- */
const A2HS = 'tasting-a2hs-v1';
const isStandalone = () => { try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } };
const ua = navigator.userAgent || '', isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), isAndroid = /Android/.test(ua);
const inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua) || (isIOS && !/Safari\//.test(ua)) || (isIOS && /CriOS|FxiOS|EdgiOS/.test(ua) && false);
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
if ('serviceWorker' in navigator && /^https:/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
function infoBox(html) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'modal';
    o.innerHTML = `<div class="mbox" role="dialog" aria-modal="true">${html}<div class="mbtns">${S.inviteCopy ? '<button type="button" class="btn ghost" data-c="1">招待コードをコピー</button>' : ''}<button type="button" class="btn" data-r="1">${frBtn("D'accord")}</button></div></div>`;
    o.addEventListener('click', async e => { const c = e.target.closest('[data-c]'); if (c) { try { await navigator.clipboard.writeText(gGet(GINV)); toast('招待コードをコピーしました。'); } catch (x) { toast('コピーできませんでした。主催者からのメッセージをもう一度開いてください。'); } return; }
      if (e.target.closest('[data-r]') || e.target === o) { o.remove(); res(); } });
    document.body.appendChild(o); o.querySelector('[data-r]').focus();
  });
}
async function showA2HSGuide() {
  if (deferredInstall) { try { deferredInstall.prompt(); const r = await deferredInstall.userChoice; deferredInstall = null; if (r && r.outcome === 'accepted') { gSet(A2HS, 'done'); toast('ホーム画面に追加しました。'); } return; } catch (e) {} }
  const inv = gGet(GINV);
  /* iPhoneでは、ホーム画面から開いたときの保存場所がSafariとは別になるため、招待コードをURLに付けておき、念のためコピーもできるようにする */
  if (inv && isIOS) { try { history.replaceState(null, '', location.pathname + location.search + '#invite=' + inv); } catch (e) {} }
  S.inviteCopy = !!inv;
  const after = inv ? '<p class="hint" style="font-size:13px">ホーム画面から開くと、AI機能の設定（招待コード）が引き継がれない場合があります。そのときは「AI設定」で招待コードを貼り付けてください（下のボタンでコピーできます）。</p>' : '';
  if (inApp) await infoBox(`<p><b>アプリの中のブラウザで開いています</b></p><ol class="a2steps"><li>画面の右上または右下にあるメニュー（<span class="a2ico">⋯</span> や <span class="a2ico">↗</span>）から「${isIOS ? 'Safari' : 'ブラウザ'}で開く」を選びます。</li><li>${isIOS ? 'Safari' : 'Chrome'}で開いたら、もう一度この案内が出るので「Oui」を押してください。</li></ol>`);
  else if (isIOS) await infoBox(`<p><b>ホーム画面に追加する方法（iPhone）</b></p><ol class="a2steps"><li>画面の下（iPadは上）にある共有ボタン <span class="a2ico">□↑</span> を押します。</li><li>メニューを下にスクロールして「<b>ホーム画面に追加</b>」を押します。</li><li>右上の「<b>追加</b>」を押します。ホーム画面に「Carnet-du-Vin」のアイコンができます。</li></ol>${after}`);
  else if (isAndroid) await infoBox(`<p><b>ホーム画面に追加する方法（Android）</b></p><ol class="a2steps"><li>Chromeの右上のメニュー <span class="a2ico">⋮</span> を押します。</li><li>「<b>ホーム画面に追加</b>」または「<b>アプリをインストール</b>」を押します。</li></ol>${after}`);
  else await infoBox('<p><b>ホーム画面に追加する方法</b></p><p style="font-size:14px">スマホで開くと、ホーム画面に追加してアプリのように使えます。パソコンのChromeでは、アドレスバー右端のインストールボタンから追加できます。</p>');
  S.inviteCopy = false;
  if (isIOS && inv) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
}
setTimeout(async () => {
  if (isStandalone()) { gSet(A2HS, 'done'); return; }
  if (!isPhone() || gGet(A2HS) || document.querySelector('.modal')) return;
  const yes = await ask('Carnet-du-Vin をホーム画面に追加しますか？\n\nアプリのようにすぐ開けて、回答の記録も消えにくくなります。', 'はい', 'いいえ');
  gSet(A2HS, yes ? 'shown' : 'no');
  if (yes) await showA2HSGuide(); else toast('「使い方」タブから、いつでも追加方法を見られます。');
}, 1200);
</script>
